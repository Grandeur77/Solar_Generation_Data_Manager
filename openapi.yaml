openapi: 3.0.3
info:
  title: SLSEA Real-Time Solar Generation Data API
  version: 0.1.0
  description: |
    REST API for the Sri Lanka Sustainable Energy Authority (SLSEA). Rooftop solar
    meters push generation readings (write path); SLSEA users read the hierarchy,
    installations and generation history, scoped to their jurisdiction (read path).

    ## What is live now

    **Implemented:** `/health` and the whole read path: provinces, districts, grid substations
    and installations (collections with their filters, and members), the installation composite,
    the last-known reading, and one installation's readings collection and reading member.
    Also reading ingestion: `POST /installations/{installation-id}/readings` (201 with
    `Location`, `ETag` and `Last-Modified`; 409 for a duplicate). Readings are append-only:
    PUT, PATCH and DELETE on a reading or on the readings collection return 405 with `Allow`.
    Registry: `POST /installations` (201 with `Location`, `ETag` and `Last-Modified`; 409 when
    the installation or meter id is taken), `PUT /installations/{installation-id}` (whole-document
    replacement, never a merge; PATCH returns 405) and `DELETE` (200, then 404; readings are kept),
    both honouring `If-Match` (a stale ETag → 412).
    `/installations` and the readings history are paginated and sortable; installations filter by
    jurisdiction and `status`, readings by time window and `min-power-kw`.
    Conditional GET on every resource: a strong `ETag`, `Cache-Control: private, no-cache` and
    `Vary: Accept, Authorization` on each successful GET; `If-None-Match` (which wins) matching the
    current version → 304 with an empty body. Single resources also send `Last-Modified` and honour
    `If-Modified-Since`. Collections and pages send no `Last-Modified`: when a member leaves the list
    (a DELETE, or a PUT moving it out of a filter) no remaining member changes, so no date would
    advance. They are revalidated by `ETag` only, which changes whenever the body does.

    **Documented here but not live yet** (operations marked *(planned)*, plus):
    - Authentication: every route is currently public, including reading ingestion and the
      registry (temporary placeholders let every request through); 401 and 403 arrive with the
      security phase.
    - The generation summaries.

    Every response is `application/json`. Every error uses the `Error` schema, carries no `ETag`
    or `Last-Modified`, and is sent with `Cache-Control: no-store`.
    A well-formed filter value that matches nothing returns `200 []`; a malformed one returns 400.

    ## Error codes

    | Status | Codes |
    |---|---|
    | 400 | `INVALID_JSON`, `VALIDATION_FAILED`, `READING_IMPLAUSIBLE`, `UNKNOWN_SUBSTATION`, `ID_MISMATCH`, `INVALID_QUERY_PARAMETER`, `INVALID_TIME_WINDOW`, `INVALID_SORT_FIELD` |
    | 401 | `AUTHENTICATION_REQUIRED`, `INVALID_TOKEN`, `TOKEN_EXPIRED`, `INVALID_CREDENTIALS` |
    | 403 | `INSUFFICIENT_SCOPE`, `INSTALLATION_MISMATCH`, `OUTSIDE_JURISDICTION`, `ACCOUNT_INACTIVE` |
    | 404 | `ROUTE_NOT_FOUND`, `PROVINCE_NOT_FOUND`, `DISTRICT_NOT_FOUND`, `SUBSTATION_NOT_FOUND`, `INSTALLATION_NOT_FOUND`, `READING_NOT_FOUND`, `NO_READINGS_YET` |
    | 405 | `METHOD_NOT_ALLOWED` |
    | 406 | `NOT_ACCEPTABLE` |
    | 409 | `READING_DUPLICATE`, `INSTALLATION_ID_TAKEN`, `METER_ID_TAKEN` |
    | 412 | `PRECONDITION_FAILED` |
    | 413 | `PAYLOAD_TOO_LARGE` |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` |
    | 429 | `TOO_MANY_REQUESTS` |
    | 500 | `INTERNAL_ERROR` |
    | 503 | `SERVICE_UNAVAILABLE` |

    Methods a resource does not support return 405 with an `Allow` header.
servers:
  - url: /
    description: Same origin as this documentation
security:
  - bearerAuth: []
tags:
  - name: Operations
    description: Service status for the hosting platform and monitoring
  - name: Hierarchy
    description: Provinces, districts and grid substations (read-only reference data)
  - name: Installations
    description: Solar installations (registry CRUD) and the installation composite
  - name: Readings
    description: Append-only generation readings of one installation
  - name: Summaries
    description: Derived generation figures across a district or province

paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Check that the service and its database are running
      description: Public liveness check. No token is needed, so the hosting platform and monitoring can call it. The database is pinged on every call.
      security: []
      responses:
        '200':
          description: The service is running and the database answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503':
          description: The database cannot be reached (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: SERVICE_UNAVAILABLE
                message: The database cannot be reached.
                details: []
                more_info: /api-docs#error-codes

  /provinces:
    get:
      tags: [Hierarchy]
      operationId: listProvinces
      summary: List provinces in the caller's jurisdiction
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Provinces (flat array, not paginated)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Province' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /provinces/{province-id}:
    parameters:
      - $ref: '#/components/parameters/ProvinceId'
    get:
      tags: [Hierarchy]
      operationId: getProvince
      summary: Get one province
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The province
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Province' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProvinceNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /provinces/{province-id}/generation-summary:
    parameters:
      - $ref: '#/components/parameters/ProvinceId'
    get:
      tags: [Summaries]
      operationId: getProvinceGenerationSummary
      summary: (planned) Current total power and a day's energy across a province
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The province summary
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvinceGenerationSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }

  /districts:
    get:
      tags: [Hierarchy]
      operationId: listDistricts
      summary: List districts in the caller's jurisdiction
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Districts (flat array, not paginated)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/District' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/InvalidQueryParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /districts/{district-id}:
    parameters:
      - $ref: '#/components/parameters/DistrictId'
    get:
      tags: [Hierarchy]
      operationId: getDistrict
      summary: Get one district
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The district
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/District' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DistrictNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /districts/{district-id}/generation-summary:
    parameters:
      - $ref: '#/components/parameters/DistrictId'
    get:
      tags: [Summaries]
      operationId: getDistrictGenerationSummary
      summary: (planned) Current total power and a day's energy across a district
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The district summary
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictGenerationSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }

  /grid-substations:
    get:
      tags: [Hierarchy]
      operationId: listGridSubstations
      summary: List grid substations in the caller's jurisdiction
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/DistrictIdFilter'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: Grid substations (flat array, not paginated)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GridSubstation' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/InvalidQueryParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /grid-substations/{substation-id}:
    parameters:
      - $ref: '#/components/parameters/SubstationId'
    get:
      tags: [Hierarchy]
      operationId: getGridSubstation
      summary: Get one grid substation
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The grid substation
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridSubstation' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SubstationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /installations:
    get:
      tags: [Installations]
      operationId: listInstallations
      summary: List installations in the caller's jurisdiction (paginated)
      description: |
        One page as `{count, next, previous, results}`, items in the plain shape (no last_reading).
        Filters combine (AND); every malformed filter or page value is reported in one 400, then the
        sort is checked. Links keep every filter and the sort. Ties are ordered by installation_id.
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/DistrictIdFilter'
        - $ref: '#/components/parameters/SubstationIdFilter'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/InstallationSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: One page of installations (plain shape, no last_reading)
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: INVALID_QUERY_PARAMETER (a malformed filter, status or page value; all reported at once) or INVALID_SORT_FIELD (reference lists installation_id, name, capacity_kw)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidQueryParameter:
                  summary: Two malformed values reported together
                  value:
                    code: INVALID_QUERY_PARAMETER
                    message: One or more query parameters are invalid.
                    details:
                      - { field: district-id, location: query, issue: 'Must match DT-01, given once.', reference: null }
                      - { field: status, location: query, issue: 'Must be one of: active, inactive, given once.', reference: null }
                    more_info: /api-docs#error-codes
                invalidSortField:
                  summary: sort names a field installations cannot be sorted by
                  value:
                    code: INVALID_SORT_FIELD
                    message: The sort field is not supported.
                    details:
                      - { field: sort, location: query, issue: 'Use one allowed field, prefixed with - for descending, given once.', reference: 'installation_id, name, capacity_kw' }
                    more_info: /api-docs#error-codes
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Installations]
      operationId: createInstallation
      summary: Register a new installation (registry admin)
      description: |
        The admin supplies the readable `installation_id`. `district_id` and `province_id` are copied
        from the substation by the server; sending them (or `last_reading`) is a 400.
        Registry-admin authentication is a placeholder for now (every request is accepted).
        Order of checks: 415 → 400 INVALID_JSON / 413 → 400 VALIDATION_FAILED → 400 UNKNOWN_SUBSTATION → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallationCreate' }
      responses:
        '201':
          description: Created. The body is the new installation as the composite (last_reading is null).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '400':
          description: VALIDATION_FAILED (one details entry per field), UNKNOWN_SUBSTATION (substation_id names no substation; 400 because the problem is a body field, not the URI), or INVALID_JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                validationFailed:
                  summary: A server-set field was sent and capacity is invalid
                  value:
                    code: VALIDATION_FAILED
                    message: The installation has 2 problems.
                    details:
                      - { field: district_id, location: body, issue: 'Not accepted: the server copies it from the substation.', reference: null }
                      - { field: capacity_kw, location: body, issue: Must be a number greater than 0., reference: null }
                    more_info: /api-docs#error-codes
                unknownSubstation:
                  summary: substation_id is well-formed but does not exist
                  value:
                    code: UNKNOWN_SUBSTATION
                    message: No grid substation with id SS-999.
                    details:
                      - { field: substation_id, location: body, issue: No grid substation with this id exists., reference: null }
                    more_info: /api-docs#error-codes
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: INSTALLATION_ID_TAKEN (reference is the existing installation) or METER_ID_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                installationIdTaken:
                  summary: installation_id is already registered
                  value:
                    code: INSTALLATION_ID_TAKEN
                    message: Installation INS-0001 is already registered.
                    details:
                      - { field: installation_id, location: body, issue: Already registered., reference: /installations/INS-0001 }
                    more_info: /api-docs#error-codes
                meterIdTaken:
                  summary: meter_id is fitted to another installation
                  value:
                    code: METER_ID_TAKEN
                    message: Meter MTR-000001 is already fitted to another installation.
                    details:
                      - { field: meter_id, location: body, issue: Already used by another installation., reference: null }
                    more_info: /api-docs#error-codes
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /installations/{installation-id}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [Installations]
      operationId: getInstallation
      summary: Get an installation with its latest reading (composite)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The installation composite. last_reading is null if there are no readings yet.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InstallationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Installations]
      operationId: replaceInstallation
      summary: Replace a whole installation (registry admin)
      description: |
        Whole-document replacement. Every writable field must be sent; a missing one is a 400, never
        filled in from the stored version (no merge). PUT never creates: an unknown id is 404, decided
        before the body is read. `installation_id` may be left out; if sent it must equal the path
        (otherwise 400 ID_MISMATCH). `district_id` and `province_id` are recalculated from the
        substation. The meter's credential and `created_at` are kept; readings keep the jurisdiction
        they were recorded under. Registry-admin authentication is a placeholder for now.
        Optional `If-Match`: the ETag last received for this installation (from GET, POST or PUT). A stale one
        → 412 and nothing changes; checked after the 404 and before the body.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallationReplace' }
      responses:
        '200':
          description: Replaced. The body is the installation as the composite.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '400':
          description: VALIDATION_FAILED (including any missing field), ID_MISMATCH, UNKNOWN_SUBSTATION, or INVALID_JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                partialBody:
                  summary: A partial (merge-style) body is refused
                  value:
                    code: VALIDATION_FAILED
                    message: The installation has 8 problems.
                    details:
                      - { field: meter_id, location: body, issue: Required., reference: null }
                      - { field: substation_id, location: body, issue: Required., reference: null }
                    more_info: /api-docs#error-codes
                idMismatch:
                  summary: The body names a different installation than the URL
                  value:
                    code: ID_MISMATCH
                    message: The body's installation_id does not match the URL (INS-0001).
                    details:
                      - { field: installation_id, location: body, issue: 'Must equal INS-0001, or be left out.', reference: /installations/INS-0001 }
                    more_info: /api-docs#error-codes
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InstallationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: METER_ID_TAKEN. The meter is fitted to another installation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: METER_ID_TAKEN, message: Meter MTR-000002 is already fitted to another installation., details: [ { field: meter_id, location: body, issue: Already used by another installation., reference: null } ], more_info: /api-docs#error-codes }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Installations]
      operationId: patchInstallationNotAllowed
      summary: Not allowed. Use PUT with the whole installation (405)
      security: []
      responses:
        '405':
          description: METHOD_NOT_ALLOWED. Partial updates are not offered; PUT replaces the whole installation.
          headers:
            Allow:
              description: The methods this URI does support
              schema: { type: string, example: 'GET, HEAD, PUT, DELETE' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: METHOD_NOT_ALLOWED, message: 'Partial updates are not supported: use PUT with the whole installation. Allowed: GET, HEAD, PUT, DELETE.', details: [], more_info: /api-docs#error-codes }
    delete:
      tags: [Installations]
      operationId: deleteInstallation
      summary: Remove an installation (registry admin). Its readings are kept.
      description: |
        Returns 200 with the installation as it was just before removal; a second DELETE returns 404.
        There is no cascade: the installation's readings stay in the database as the record of what
        was generated, still counted under the district they were recorded in. Because their parent
        no longer exists, the scoped readings URIs then return 404.
        Registry-admin authentication is a placeholder for now.
        Optional `If-Match`: a stale ETag → 412 and nothing is deleted; checked after the 404.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Removed. The body is the installation as the composite, as it was just before removal. A second DELETE returns 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InstallationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /installations/{installation-id}/last-known-reading:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [Readings]
      operationId: getLastKnownReading
      summary: The most recent reading of an installation (derived)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The latest reading
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: INSTALLATION_NOT_FOUND, or NO_READINGS_YET when the installation exists but has no readings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noReadingsYet:
                  summary: The installation exists but has not reported yet
                  value: { code: NO_READINGS_YET, message: Installation INS-0030 has not reported any readings yet., details: [], more_info: /api-docs#error-codes }
                installationNotFound:
                  summary: No such installation
                  value: { code: INSTALLATION_NOT_FOUND, message: No installation with id INS-9999., details: [], more_info: /api-docs#error-codes }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /installations/{installation-id}/readings:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [Readings]
      operationId: listReadings
      summary: Generation history of one installation (paginated)
      description: |
        One page of the history, newest first, as `{count, next, previous, results}`. `count` is the
        total across all pages. `next` is null on the last page and `previous` is null on page 1; a page
        past the end returns empty `results` with `previous` pointing at the last page that has items.
        Links are relative and canonical (always `page`, `page-size` and `sort`, in that order) and keep
        every active parameter. An existing installation with no readings returns `count: 0`.
        Optional time window `[from, to)` on the measurement `timestamp`: `from` inclusive, `to`
        exclusive, so adjacent windows never count a reading twice. `count` and the links reflect it.
        Sorted by `sort` (default `-timestamp`, newest first); equal values are ordered newest first,
        so pages never repeat or skip readings.
        A missing installation is 404 before the query values are checked.
        Optional `min-power-kw`: only readings with power_kw at or above it.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/MinPowerKw'
        - $ref: '#/components/parameters/ReadingSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: One page of the installation's readings, newest first
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingPage' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400':
          description: |
            INVALID_QUERY_PARAMETER: page or page-size not a whole number in range (page ≥ 1, page-size 1–100),
            from or to not a real ISO-8601 date-time with a time zone, or any of them given more than once.
            Every bad value is reported in one response. INVALID_SORT_FIELD: sort is not exactly one of
            the allowed fields (reference lists them). INVALID_TIME_WINDOW: from is not earlier than to.
            Checked in that order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalidQueryParameter:
                  summary: A page-size above the cap and a date without a time zone
                  value:
                    code: INVALID_QUERY_PARAMETER
                    message: One or more query parameters are invalid.
                    details:
                      - { field: page-size, location: query, issue: 'Must be a whole number from 1 to 100, given once.', reference: null }
                      - { field: from, location: query, issue: 'Must be one ISO-8601 date-time with a time zone, e.g. 2026-10-05T00:00:00+05:30 or 2026-10-04T18:30:00Z.', reference: null }
                    more_info: /api-docs#error-codes
                invalidSortField:
                  summary: sort names a field that cannot be sorted on
                  value:
                    code: INVALID_SORT_FIELD
                    message: The sort field is not supported.
                    details:
                      - { field: sort, location: query, issue: 'Use one allowed field, prefixed with - for descending, given once.', reference: 'timestamp, power_kw, energy_kwh' }
                    more_info: /api-docs#error-codes
                invalidTimeWindow:
                  summary: from is after to
                  value:
                    code: INVALID_TIME_WINDOW
                    message: from must be earlier than to.
                    details:
                      - { field: from, location: query, issue: Must be earlier than to (2026-10-06T06:00:00.000Z)., reference: null }
                      - { field: to, location: query, issue: Must be later than from (2026-10-06T12:00:00.000Z)., reference: null }
                    more_info: /api-docs#error-codes
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InstallationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Readings]
      operationId: createReading
      summary: A meter pushes a new reading for its own installation
      description: |
        The installation comes from the path, never the body: an `installation_id` in the body is
        rejected with 400. The server sets `reading_id`, `received_at` (its own clock) and the
        jurisdiction ids (copied from the installation); sending any of them is also a 400.
        `Location` points to the new reading and resolves with GET; `Last-Modified` is `received_at`.
        Device authentication is a placeholder for now (every request is accepted).
        A second reading for the same installation and instant is refused with 409 READING_DUPLICATE;
        the stored reading is never overwritten, and `details[0].reference` is its URI. A device
        retrying after a lost response treats 409 as success.

        Physically implausible readings are refused with 400 READING_IMPLAUSIBLE, one details entry
        per broken rule:
        - `power_kw` at most the installation's `capacity_kw` × 1.1 (reference: the installation);
        - `energy_kwh` (a cumulative total) not lower than the reading just before this timestamp,
          and not higher than the reading just after it, if any (reference: that reading). Late,
          out-of-order readings are checked against their neighbours by time, not by arrival;
        - `timestamp` no more than 5 minutes ahead of the server clock;
        - `voltage` between 180 and 270 V.

        Order of checks: 415 → 400 INVALID_JSON / 413 → 400 VALIDATION_FAILED → 404 →
        400 READING_IMPLAUSIBLE → 409 READING_DUPLICATE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingCreate' }
      responses:
        '201':
          description: Created. The body is the stored reading.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '400':
          description: VALIDATION_FAILED (structure, one details entry per problem), READING_IMPLAUSIBLE (physically impossible values), or INVALID_JSON when the body cannot be parsed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                validationFailed:
                  summary: Missing field and an installation_id sent in the body
                  value:
                    code: VALIDATION_FAILED
                    message: The reading has 2 problems.
                    details:
                      - { field: installation_id, location: body, issue: 'Not accepted in the body: the installation comes from the URL path.', reference: null }
                      - { field: voltage, location: body, issue: Required., reference: null }
                    more_info: /api-docs#error-codes
                readingImplausible:
                  summary: Power above what the installation can produce, and energy lower than the previous reading
                  value:
                    code: READING_IMPLAUSIBLE
                    message: 2 values are physically implausible for this installation.
                    details:
                      - { field: power_kw, location: body, issue: '9 kW is more than this installation can produce: at most 5.5 kW (capacity 5 kW × 1.1).', reference: /installations/INS-0001 }
                      - { field: energy_kwh, location: body, issue: '1019.9 kWh is lower than the previous reading (1020 kWh at 2026-10-06T12:30:00.000Z); the meter total never decreases.', reference: /installations/INS-0001/readings/66f2c1a9e4b0a1b2c3d4e5f6 }
                    more_info: /api-docs#error-codes
                invalidJson:
                  summary: Body is not valid JSON
                  value: { code: INVALID_JSON, message: The request body is not valid JSON., details: [], more_info: /api-docs#error-codes }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/InstallationNotFound' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: READING_DUPLICATE. This installation already has a reading at this instant; reference is its URI.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: READING_DUPLICATE
                message: Installation INS-0001 already has a reading at 2026-10-06T12:30:00.000Z.
                details:
                  - { field: timestamp, location: body, issue: A reading for this installation and timestamp already exists., reference: /installations/INS-0001/readings/66f2c1a9e4b0a1b2c3d4e5f6 }
                more_info: /api-docs#error-codes
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Readings]
      operationId: replaceReadingsNotAllowed
      summary: Not allowed. Readings are append-only (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedCollection' }
    patch:
      tags: [Readings]
      operationId: patchReadingsNotAllowed
      summary: Not allowed. Readings are append-only (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedCollection' }
    delete:
      tags: [Readings]
      operationId: deleteReadingsNotAllowed
      summary: Not allowed. A reading history is never erased (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedCollection' }

  /installations/{installation-id}/readings/{reading-id}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
      - $ref: '#/components/parameters/ReadingId'
    get:
      tags: [Readings]
      operationId: getReading
      summary: One reading (the target of a 201 Location)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The reading
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/LastModified' }
            Vary: { $ref: '#/components/headers/Vary' }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: INSTALLATION_NOT_FOUND when the parent is missing, or READING_NOT_FOUND when this installation has no such reading (including a real reading id that belongs to another installation)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                readingNotFound:
                  summary: No such reading under this installation
                  value: { code: READING_NOT_FOUND, message: Installation INS-0002 has no reading with id 66f2c1a9e4b0a1b2c3d4e5f6., details: [], more_info: /api-docs#error-codes }
                installationNotFound:
                  summary: The parent installation is missing
                  value: { code: INSTALLATION_NOT_FOUND, message: No installation with id INS-9999., details: [], more_info: /api-docs#error-codes }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Readings]
      operationId: replaceReadingNotAllowed
      summary: Not allowed. A reading is never replaced (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedReading' }
    patch:
      tags: [Readings]
      operationId: patchReadingNotAllowed
      summary: Not allowed. A reading is never edited (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedReading' }
    delete:
      tags: [Readings]
      operationId: deleteReadingNotAllowed
      summary: Not allowed. A reading is never deleted (405)
      security: []
      responses:
        '405': { $ref: '#/components/responses/MethodNotAllowedReading' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token. Scopes (installation-write, analyst-read-by-jurisdiction, asset-admin) are documented in Step 9.9.

  parameters:
    ProvinceId:
      name: province-id
      in: path
      required: true
      schema: { type: string, pattern: '^PV-[0-9]{2}$', example: PV-01 }
    DistrictId:
      name: district-id
      in: path
      required: true
      schema: { type: string, pattern: '^DT-[0-9]{2}$', example: DT-01 }
    SubstationId:
      name: substation-id
      in: path
      required: true
      schema: { type: string, pattern: '^SS-[0-9]{3}$', example: SS-001 }
    InstallationId:
      name: installation-id
      in: path
      required: true
      schema: { type: string, pattern: '^INS-[0-9]{4}$', example: INS-0001 }
    ReadingId:
      name: reading-id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{24}$', example: 66f2c1a9e4b0a1b2c3d4e5f6 }
    ProvinceIdFilter:
      name: province-id
      in: query
      description: Only members in this province. Combines with the other filters (all must match). Malformed or repeated → 400 INVALID_QUERY_PARAMETER. From the security phase it is also intersected with the caller's jurisdiction (outside it → 403).
      schema: { type: string, pattern: '^PV-[0-9]{2}$', example: PV-01 }
    DistrictIdFilter:
      name: district-id
      in: query
      description: Only members in this district. Combines with the other filters (all must match). Malformed or repeated → 400 INVALID_QUERY_PARAMETER. From the security phase it is also intersected with the caller's jurisdiction (outside it → 403).
      schema: { type: string, pattern: '^DT-[0-9]{2}$', example: DT-01 }
    SubstationIdFilter:
      name: substation-id
      in: query
      description: Only installations on this substation. Combines with the other filters (all must match). Malformed or repeated → 400 INVALID_QUERY_PARAMETER. From the security phase it is also intersected with the caller's jurisdiction (outside it → 403).
      schema: { type: string, pattern: '^SS-[0-9]{3}$', example: SS-001 }
    Status:
      name: status
      in: query
      description: Only installations with this status. Any other value, or the parameter given twice → 400.
      schema: { type: string, enum: [active, inactive] }
    From:
      name: from
      in: query
      description: Readings measured at or after this instant (inclusive). Must include a time zone. Encode + as %2B in a URL (an unencoded + arrives as a space, which is also accepted).
      schema: { type: string, format: date-time, example: '2026-10-05T00:00:00+05:30' }
    To:
      name: to
      in: query
      description: Readings measured before this instant (exclusive). Must include a time zone and be later than from.
      schema: { type: string, format: date-time, example: '2026-10-06T00:00:00+05:30' }
    MinPowerKw:
      name: min-power-kw
      in: query
      description: Only readings with power_kw at or above this value (inclusive). A plain decimal number ≥ 0; anything else → 400.
      schema: { type: number, minimum: 0, example: 1.5 }
    ReadingSort:
      name: sort
      in: query
      description: One field, written as in the JSON; prefix with - for descending. Ties are ordered newest first. Anything else → 400 INVALID_SORT_FIELD.
      schema:
        type: string
        enum: [timestamp, -timestamp, power_kw, -power_kw, energy_kwh, -energy_kwh]
        default: -timestamp
    InstallationSort:
      name: sort
      in: query
      description: One field, written as in the JSON; prefix with - for descending. Ties are ordered by installation_id. Anything else → 400 INVALID_SORT_FIELD.
      schema:
        type: string
        enum: [installation_id, -installation_id, name, -name, capacity_kw, -capacity_kw]
        default: installation_id
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page-size
      in: query
      description: Items per page. Above 100 is a 400, never silently reduced.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Date:
      name: date
      in: query
      description: Sri Lanka calendar day (Asia/Colombo) to summarise, YYYY-MM-DD. Defaults to today. An impossible date, another format or a day after today → 400 INVALID_QUERY_PARAMETER.
      schema: { type: string, format: date, example: '2026-10-06' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag(s) the client holds. A match returns 304.
      schema: { type: string, example: '"a3f9c2d1"' }
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      description: Used only when If-None-Match is absent. Not modified since this date returns 304.
      schema: { type: string, example: 'Tue, 06 Oct 2026 04:30:00 GMT' }
    IfMatch:
      name: If-Match
      in: header
      description: Optional. The ETag the client last received for this installation (from GET, POST or PUT), a comma-separated list of them, or * for any existing installation. Strong comparison, so W/ tags never match. A mismatch returns 412 and nothing changes.
      schema: { type: string, example: '"a3f9c2d1"' }

  headers:
    ETag:
      description: Strong validator, a quoted hash of the response body
      schema: { type: string, example: '"a3f9c2d1"' }
    LastModified:
      description: When the representation last changed. Sent on single resources only, never on a collection or page.
      schema: { type: string, example: 'Tue, 06 Oct 2026 04:30:04 GMT' }
    Location:
      description: URI of the created resource. It resolves with GET.
      schema: { type: string, example: /installations/INS-0001/readings/66f2c1a9e4b0a1b2c3d4e5f6 }
    Vary:
      schema: { type: string, example: 'Accept, Authorization' }
    CacheControl:
      schema: { type: string, example: 'private, no-cache' }
    WWWAuthenticate:
      schema: { type: string, example: 'Bearer realm="slsea-solar-api"' }
    AllowReading:
      description: The methods this URI does support
      schema: { type: string, example: 'GET, HEAD' }
    AllowReadings:
      description: The methods this URI does support
      schema: { type: string, example: 'GET, HEAD, POST' }

  responses:
    NotModified:
      description: The client's copy is current. No body. Last-Modified is present only for single resources.
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/LastModified' }
        Vary: { $ref: '#/components/headers/Vary' }
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
    BadRequest:
      description: Invalid body or query value
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired token
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWWAuthenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid token but not allowed (scope, installation or jurisdiction)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The member or its parent does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotAcceptable:
      description: The Accept header excludes application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflicts with existing data (duplicate reading, installation_id or meter_id)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: PRECONDITION_FAILED. If-Match does not match the installation's current ETag (strong comparison; W/ tags never match). Nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: PRECONDITION_FAILED
            message: The installation has changed since you last read it. Fetch it again, then retry.
            details:
              - { field: If-Match, location: header, issue: Does not match the current ETag of this installation., reference: null }
            more_info: /api-docs#error-codes
    PayloadTooLarge:
      description: The request body is over 100 KB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The request body is not application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidQueryParameter:
      description: A filter value is malformed or given more than once (INVALID_QUERY_PARAMETER)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INVALID_QUERY_PARAMETER
            message: province-id must be a single id like PV-01.
            details:
              - { field: province-id, location: query, issue: Must match PV-01., reference: null }
            more_info: /api-docs#error-codes
    ProvinceNotFound:
      description: No province with this id (PROVINCE_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: PROVINCE_NOT_FOUND, message: No province with id PV-99., details: [], more_info: /api-docs#error-codes }
    DistrictNotFound:
      description: No district with this id (DISTRICT_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: DISTRICT_NOT_FOUND, message: No district with id DT-99., details: [], more_info: /api-docs#error-codes }
    SubstationNotFound:
      description: No grid substation with this id (SUBSTATION_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SUBSTATION_NOT_FOUND, message: No grid substation with id SS-999., details: [], more_info: /api-docs#error-codes }
    InstallationNotFound:
      description: No installation with this id; for a scoped resource, the parent is missing (INSTALLATION_NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INSTALLATION_NOT_FOUND, message: No installation with id INS-9999., details: [], more_info: /api-docs#error-codes }
    MethodNotAllowedReading:
      description: METHOD_NOT_ALLOWED. Readings are append-only; Allow is GET, HEAD. Answered without touching the database.
      headers:
        Allow: { $ref: '#/components/headers/AllowReading' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: METHOD_NOT_ALLOWED, message: 'Readings are append-only: DELETE is not allowed here. Allowed: GET, HEAD.', details: [], more_info: /api-docs#error-codes }
    MethodNotAllowedCollection:
      description: METHOD_NOT_ALLOWED. A reading history is never replaced or erased; Allow is GET, HEAD, POST.
      headers:
        Allow: { $ref: '#/components/headers/AllowReadings' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: METHOD_NOT_ALLOWED, message: 'Readings are append-only: DELETE is not allowed here. Allowed: GET, HEAD, POST.', details: [], more_info: /api-docs#error-codes }
    ServiceUnavailable:
      description: The database cannot be reached (SERVICE_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: SERVICE_UNAVAILABLE, message: The database cannot be reached., details: [], more_info: /api-docs#error-codes }

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        database:
          type: string
          enum: [connected]
          example: connected
    Province:
      type: object
      required: [province_id, name]
      properties:
        province_id: { type: string, example: PV-01 }
        name: { type: string, example: Western }

    District:
      type: object
      required: [district_id, name, province_id]
      properties:
        district_id: { type: string, example: DT-01 }
        name: { type: string, example: Colombo }
        province_id: { type: string, example: PV-01 }

    GridSubstation:
      type: object
      required: [substation_id, name, district_id]
      properties:
        substation_id: { type: string, example: SS-001 }
        name: { type: string, example: Kolonnawa }
        district_id: { type: string, example: DT-01 }

    Installation:
      type: object
      required: [installation_id, name, meter_id, substation_id, district_id, province_id, capacity_kw, status, commissioned_at, address, latitude, longitude]
      properties:
        installation_id: { type: string, example: INS-0001 }
        name: { type: string, example: Borella rooftop 1 }
        meter_id: { type: string, example: MTR-000001 }
        substation_id: { type: string, example: SS-001 }
        district_id: { type: string, readOnly: true, description: Copied by the server from the substation, example: DT-01 }
        province_id: { type: string, readOnly: true, description: Copied by the server from the substation, example: PV-01 }
        capacity_kw: { type: number, minimum: 0, exclusiveMinimum: true, example: 5.0 }
        status: { type: string, enum: [active, inactive], example: active }
        commissioned_at: { type: string, format: date-time, example: '2025-03-14T00:00:00Z' }
        address: { type: string, example: '12 Baseline Road, Colombo 08' }
        latitude: { type: number, minimum: -90, maximum: 90, example: 6.9147 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 79.8773 }

    InstallationComposite:
      description: An installation plus exactly one nested latest reading (null if none). Never the history.
      allOf:
        - $ref: '#/components/schemas/Installation'
        - type: object
          required: [last_reading]
          properties:
            last_reading:
              # OpenAPI 3.0.3: nullable only takes effect when type is set in the same schema.
              description: The newest reading, or null when the installation has not reported yet.
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/Reading'

    InstallationReplace:
      description: Every writable field. Server-set fields (district_id, province_id, last_reading) are not accepted.
      type: object
      additionalProperties: false
      required: [name, meter_id, substation_id, capacity_kw, status, commissioned_at, address, latitude, longitude]
      properties:
        installation_id: { type: string, description: Optional; if present it must equal the path id, example: INS-0221 }
        name: { type: string, example: Nugegoda rooftop 4 }
        meter_id: { type: string, example: MTR-000221 }
        substation_id: { type: string, example: SS-003 }
        capacity_kw: { type: number, minimum: 0, exclusiveMinimum: true, example: 4.2 }
        status: { type: string, enum: [active, inactive], example: active }
        commissioned_at: { type: string, format: date-time, example: '2026-10-01T00:00:00Z' }
        address: { type: string, example: '45 High Level Road, Nugegoda' }
        latitude: { type: number, minimum: -90, maximum: 90, example: 6.8649 }
        longitude: { type: number, minimum: -180, maximum: 180, example: 79.8997 }

    InstallationCreate:
      description: The admin supplies the readable installation_id.
      allOf:
        - $ref: '#/components/schemas/InstallationReplace'
        - type: object
          required: [installation_id]

    Reading:
      type: object
      required: [reading_id, installation_id, timestamp, power_kw, energy_kwh, voltage, received_at]
      properties:
        reading_id: { type: string, example: 66f2c1a9e4b0a1b2c3d4e5f6 }
        installation_id: { type: string, example: INS-0001 }
        timestamp: { type: string, format: date-time, description: When the device measured, example: '2026-10-06T04:30:00Z' }
        power_kw: { type: number, minimum: 0, description: Instantaneous power, example: 3.62 }
        energy_kwh: { type: number, minimum: 0, description: Cumulative energy since the meter started; never decreases, example: 1532.8 }
        voltage: { type: number, description: Grid voltage in volts, example: 231.2 }
        received_at: { type: string, format: date-time, description: When the server stored it, example: '2026-10-06T04:30:04Z' }

    ReadingCreate:
      description: The installation comes from the path. The server sets reading_id, received_at and the jurisdiction ids; sending any of them, or installation_id, is a 400.
      type: object
      additionalProperties: false
      required: [timestamp, power_kw, energy_kwh, voltage]
      properties:
        timestamp: { type: string, format: date-time, example: '2026-10-06T04:30:00Z' }
        power_kw: { type: number, minimum: 0, example: 3.62 }
        energy_kwh: { type: number, minimum: 0, example: 1532.8 }
        voltage: { type: number, example: 231.2 }

    ReadingPage:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer, minimum: 0, description: Total matching readings across all pages, example: 768 }
        next: { type: string, nullable: true, example: '/installations/INS-0001/readings?page=2&page-size=50&sort=-timestamp' }
        previous: { type: string, nullable: true, example: null }
        results:
          type: array
          items: { $ref: '#/components/schemas/Reading' }

    InstallationPage:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer, minimum: 0, example: 220 }
        next: { type: string, nullable: true, example: '/installations?page=2&page-size=50&sort=installation_id' }
        previous: { type: string, nullable: true, example: null }
        results:
          type: array
          items: { $ref: '#/components/schemas/Installation' }

    DistrictGenerationSummary:
      type: object
      required: [district_id, date, total_power_kw, power_as_of, day_energy_kwh]
      properties:
        district_id: { type: string, example: DT-01 }
        date: { type: string, format: date, description: 'Sri Lanka calendar day summarised: [date 00:00 +05:30, next day 00:00 +05:30)', example: '2026-10-06' }
        total_power_kw: { type: number, description: 'Sum of the latest power_kw in the day of every installation that reported that day (3 dp). For today, current power; for a past date, power at the end of that day', example: 41.73 }
        power_as_of: { type: string, format: date-time, nullable: true, description: Newest timestamp among the readings in total_power_kw; null when no installation reported that day, example: '2026-10-06T04:30:00Z' }
        day_energy_kwh: { type: number, description: "Sum per installation of (latest energy_kwh in the day − latest energy_kwh before the day, or the day's first if there is none), 3 dp", example: 182.4 }

    ProvinceGenerationSummary:
      type: object
      required: [province_id, date, total_power_kw, power_as_of, day_energy_kwh]
      properties:
        province_id: { type: string, example: PV-01 }
        date: { type: string, format: date, example: '2026-10-06' }
        total_power_kw: { type: number, example: 312.5 }
        power_as_of: { type: string, format: date-time, nullable: true, example: '2026-10-06T04:30:00Z' }
        day_energy_kwh: { type: number, example: 1410.2 }

    ErrorDetail:
      type: object
      required: [field, location, issue, reference]
      properties:
        field: { type: string, nullable: true, example: power_kw }
        location: { type: string, nullable: true, enum: [path, query, body, header, null], example: body }
        issue: { type: string, example: Must be 0 or more. }
        reference: { type: string, nullable: true, example: null }

    Error:
      type: object
      required: [code, message, details, more_info]
      properties:
        code: { type: string, description: Stable machine-readable code (see Error codes), example: VALIDATION_FAILED }
        message: { type: string, example: The reading has 1 invalid field. }
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        more_info: { type: string, example: '/api-docs#error-codes' }
